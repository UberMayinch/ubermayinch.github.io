{{ define "main" }}
<div class="home">
  <ul class="post-list">
    {{ range where site.RegularPages "Section" "posts" }}
    <li>
      <span class="post-meta">{{ .Date.Format "Jan 2, 2006" }}</span>
      <h3><a class="post-link" href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
