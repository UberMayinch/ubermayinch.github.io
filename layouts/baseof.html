<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <link rel="stylesheet" href="{{ "css/katex/katex.min.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <header class="site-header">
    <div class="wrapper">
      <a class="site-title" href="{{ "" | relURL }}">{{ site.Title }}</a>
      <nav class="site-nav">
        {{ range site.Menus.main }}
        <a class="page-link" href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>
  </header>

  <main class="page-content">
    <div class="wrapper">
      {{ block "main" . }}{{ end }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>{{ site.Params.author }} · {{ site.Params.email }}</p>
      <p class="description">{{ site.Params.description }}</p>
    </div>
  </footer>

  {{ partial "buymeacoffee.html" . }}
</body>
</html>
